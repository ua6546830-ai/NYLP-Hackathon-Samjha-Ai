name: Samjha? Rx Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Environment & Secrets
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samjha-rx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            pitch/Samjha_Rx_Pitch_Deck.pptx
          body: |
            ## Samjha? Rx Release 🚀
            
            **Make your prescription make sense • نسخہ سمجھیں، بے فکری سے صحت مند رہیں**
            
            ### Included in this release:
            - **Android APK (Debug):** `app-debug.apk`
            - **Marketing Pitch Deck:** `Samjha_Rx_Pitch_Deck.pptx`
            - Deterministic Clinical Safety Engine (BNF 84 / PNF)
            - Multilingual Patient Clarity (English, Roman Urdu, Urdu RTL)
            - CameraX High-Res Prescription Capture
            - Jetpack Room Local Encrypted Storage & Device PIN Lock
            - AlarmManager Medication Reminders
            - Pharmacist SBAR Query Builder & Digital Sign-off
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
